type: picture-elements
image: /local/dashboard/peblar_size1.png
card_mod:
  style: |
    ha-card {
      overflow: hidden;
      border-radius: var(--ha-card-border-radius, 12px);
    }
elements:
  - type: custom:button-card
    entity: sensor.peblar_ev_charger_state
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - width: 56px
        - height: 8.1px
        - min-height: 8.1px
        - padding: 0
        - border-radius: 8px
        - border: none
        - background: |
            [[[
              const state = entity.state;

              if (state === 'no_ev_connected') {
                return '#78F7A4';
              }

              if (state === 'suspended') {
                return '#2196F3';
              }

              if (state === 'charging') {
                return '#2196F3';
              }

              if (
                state === 'error' ||
                state === 'fault' ||
                state === 'invalid'
              ) {
                return '#F44336';
              }

              return '#666666';
            ]]]
        - box-shadow: |
            [[[
              const state = entity.state;

              if (state === 'no_ev_connected') {
                return '0 0 8px rgba(120,247,164,0.65)';
              }

              if (state === 'suspended') {
                return '0 0 8px rgba(33,150,243,0.65)';
              }

              if (state === 'charging') {
                return '0 0 16px rgba(33,150,243,0.95)';
              }

              if (
                state === 'error' ||
                state === 'fault' ||
                state === 'invalid'
              ) {
                return '0 0 16px rgba(244,67,54,0.95)';
              }

              return 'none';
            ]]]
        - animation: |
            [[[
              const state = entity.state;

              if (state === 'charging') {
                return 'peblar_blue 1.5s ease-in-out infinite';
              }

              if (
                state === 'error' ||
                state === 'fault' ||
                state === 'invalid'
              ) {
                return 'peblar_red 1.1s ease-in-out infinite';
              }

              return 'none';
            ]]]
    extra_styles: |
      @keyframes peblar_blue {
        0% {
          opacity: 1;
          box-shadow: 0 0 6px rgba(33,150,243,0.65);
        }

        50% {
          opacity: 0.30;
          box-shadow: 0 0 18px rgba(33,150,243,1);
        }

        100% {
          opacity: 1;
          box-shadow: 0 0 6px rgba(33,150,243,0.65);
        }
      }

      @keyframes peblar_red {
        0% {
          opacity: 1;
          box-shadow: 0 0 6px rgba(244,67,54,0.65);
        }

        50% {
          opacity: 0.25;
          box-shadow: 0 0 18px rgba(244,67,54,1);
        }

        100% {
          opacity: 1;
          box-shadow: 0 0 6px rgba(244,67,54,0.65);
        }
      }
    style:
      left: 50%
      top: 15.1%
      transform: translate(-50%, -50%)
      z-index: 6
  - type: custom:button-card
    entity: sensor.peblar_ev_charger_state
    triggers_update:
      - sensor.peblar_ev_charger_power
      - number.peblar_ev_charger_charge_limit
      - sensor.peblar_ev_charger_session_energy
      - sensor.peblar_ev_charger_lifetime_energy
      - update.peblar_ev_charger_firmware
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      info: |
        [[[
          let state =
            states['sensor.peblar_ev_charger_state']?.state ?? '-';

          const stateMap = {
            no_ev_connected: 'No EV connected',
            charging: 'Charging',
            suspended: 'Suspended',
            error: 'Error',
            fault: 'Fault',
            invalid: 'Invalid'
          };

          state = stateMap[state] ?? state;

          const powerRaw =
            Number(states['sensor.peblar_ev_charger_power']?.state || 0);

          const chargeLimitRaw =
            Number(
              states['number.peblar_ev_charger_charge_limit']?.state
            );

          const chargeLimit =
            Number.isFinite(chargeLimitRaw)
              ? `${chargeLimitRaw.toFixed(0)} A`
              : '-';

          const session =
            Number(states['sensor.peblar_ev_charger_session_energy']?.state || 0);

          const lifetime =
            Number(states['sensor.peblar_ev_charger_lifetime_energy']?.state || 0);

          const firmwareState =
            states['update.peblar_ev_charger_firmware']?.state ?? '-';

          const power =
            powerRaw >= 1000
              ? `${(powerRaw / 1000).toFixed(1)} kW`
              : `${powerRaw.toFixed(0)} W`;

          return `
            <div class="peblar-info">

              <div class="info-title">
                Peblar
              </div>

              <div class="info-row">
                <span class="label">State</span>
                <span class="value">${state}</span>
              </div>

              <div class="info-row">
                <span class="label">Power</span>
                <span class="value">${power}</span>
              </div>

              <div class="info-row">
                <span class="label">Charge limit</span>
                <span class="value">${chargeLimit}</span>
              </div>

              <div class="info-row">
                <span class="label">Session</span>
                <span class="value">${session.toFixed(2)} kWh</span>
              </div>

              <div class="info-row">
                <span class="label">Lifetime</span>
                <span class="value">${lifetime.toFixed(1)} kWh</span>
              </div>

              <div class="info-row">
                <span class="label">Firmware</span>
                <span class="value">${firmwareState}</span>
              </div>

            </div>
          `;
        ]]]
    styles:
      card:
        - background: none !important
        - border: none !important
        - box-shadow: none !important
        - padding: 10px 12px
      grid:
        - grid-template-areas: '"info"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto
      custom_fields:
        info:
          - width: 100%
    extra_styles: |
      .peblar-info {
        width: 100%;
        font-size: 10px;
      }

      .info-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
      }

      .label {
        color: var(--secondary-text-color);
        white-space: nowrap;
      }

      .value {
        color: var(--primary-text-color);
        font-weight: 500;
        text-align: right;
        white-space: nowrap;
      }
    style:
      left: 15.5%
      top: 16%
      width: 31%
      transform: translate(-50%, -50%)
      z-index: 4
  - type: custom:button-card
    entity: number.peblar_ev_charger_charge_limit
    name: Charge limit
    icon: mdi:gauge
    show_name: true
    show_icon: true
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - border-radius: 11px
        - background: rgba(0,0,0,0.28)
        - --amp-hue: |
            [[[
              const value = Number(entity.state);

              if (!Number.isFinite(value)) {
                return 210;
              }

              const minimum = 6;
              const maximum = 19;
              const ratio = Math.min(
                1,
                Math.max(0, (value - minimum) / (maximum - minimum))
              );

              return Math.round(120 * (1 - ratio));
            ]]]
        - border: 1px solid hsla(var(--amp-hue), 85%, 65%, 0.65)
        - box-shadow: 0 0 10px hsla(var(--amp-hue), 85%, 55%, 0.25)
        - transition: border 0.4s ease, box-shadow 0.4s ease
      icon:
        - width: 25px
        - color: hsl(var(--amp-hue), 85%, 65%)
        - filter: drop-shadow(0 0 5px hsla(var(--amp-hue), 85%, 55%, 0.60))
        - transition: color 0.4s ease, filter 0.4s ease
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
      state:
        - color: hsl(var(--amp-hue), 85%, 70%)
        - font-size: 10px
        - font-weight: 600
        - margin-top: 2px
        - transition: color 0.4s ease
    style:
      left: 10%
      top: 59%
      transform: translate(-50%, -50%)
      z-index: 5
  - type: custom:button-card
    entity: switch.peblar_ev_charger_force_single_phase
    name: |
      [[[
        return entity.state === 'on'
          ? '1 phase'
          : '3 phase';
      ]]]
    show_name: true
    show_icon: false
    show_state: false
    custom_fields:
      phase_icon: |
        [[[
          if (entity.state === 'on') {
            return `
              <div class="phase-waves single">
                <ha-icon icon="mdi:sine-wave"></ha-icon>
              </div>
            `;
          }

          return `
            <div class="phase-waves triple">
              <ha-icon icon="mdi:sine-wave"></ha-icon>
              <ha-icon icon="mdi:sine-wave"></ha-icon>
              <ha-icon icon="mdi:sine-wave"></ha-icon>
            </div>
          `;
        ]]]
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - background: rgba(0,0,0,0.28)
        - border-radius: 11px
        - --phase-color: |
            [[[
              return entity.state === 'on'
                ? '#FFC107'
                : '#2196F3';
            ]]]
        - border: |
            [[[
              return entity.state === 'on'
                ? '1px solid rgba(255,193,7,0.75)'
                : '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              return entity.state === 'on'
                ? '0 0 12px rgba(255,193,7,0.45)'
                : 'none';
            ]]]
        - transition: border 0.3s ease, box-shadow 0.3s ease
      grid:
        - grid-template-areas: '"phase_icon" "n"'
        - grid-template-columns: 1fr
        - grid-template-rows: 27px min-content
      custom_fields:
        phase_icon:
          - justify-self: center
          - align-self: center
          - color: var(--phase-color)
          - filter: |
              [[[
                return entity.state === 'on'
                  ? 'drop-shadow(0 0 5px rgba(255,193,7,0.65))'
                  : 'none';
              ]]]
          - transition: color 0.3s ease, filter 0.3s ease
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
    extra_styles: |
      .phase-waves {
        color: inherit;
      }

      .phase-waves ha-icon {
        display: block;
        color: inherit;
      }

      .phase-waves.single {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .phase-waves.single ha-icon {
        width: 25px;
        height: 25px;
      }

      .phase-waves.triple {
        position: relative;
        width: 41px;
        height: 25px;
      }

      .phase-waves.triple ha-icon {
        position: absolute;
        top: 0;
        width: 25px;
        height: 25px;
      }

      .phase-waves.triple ha-icon:nth-child(1) {
        left: 0;
        opacity: 0.60;
      }

      .phase-waves.triple ha-icon:nth-child(2) {
        left: 6px;
        opacity: 0.80;
      }

      .phase-waves.triple ha-icon:nth-child(3) {
        left: 12px;
        opacity: 1;
      }
    style:
      left: 10%
      top: 73%
      transform: translate(-50%, -50%)
      z-index: 5
  - type: custom:apexcharts-card
    graph_span: 7d12h
    span:
      end: day
    series:
      - entity: sensor.peblar_ev_charger_lifetime_energy
        name: EV
        type: column
        unit: kWh
        float_precision: 1
        statistics:
          type: change
          period: day
          align: start
        show:
          legend_value: false
          in_header: false
    apex_config:
      chart:
        height: 85
        toolbar:
          show: false
        zoom:
          enabled: false
        background: transparent
      legend:
        show: false
      grid:
        show: false
        padding:
          left: 0
          right: 0
          top: 8
          bottom: -6
      dataLabels:
        enabled: true
        offsetY: -4
        formatter: |
          EVAL:function(value) {
            if (!value || value === 0) {
              return '';
            }

            return value.toFixed(1);
          }
        style:
          fontSize: 8px
      plotOptions:
        bar:
          borderRadius: 3
          columnWidth: 20%
      xaxis:
        type: datetime
        labels:
          datetimeUTC: false
          format: ddd
          rotate: 0
          hideOverlappingLabels: false
          showDuplicates: true
        style:
          fontSize: 8px
        axisBorder:
          show: false
        axisTicks:
          show: false
      yaxis:
        show: false
        min: 0
      tooltip:
        enabled: true
        x:
          format: ddd dd MMM
    card_mod:
      style: |
        ha-card {
          background: none !important;
          background-color: transparent !important;
          border: none !important;
          box-shadow: none !important;
          padding: 2px;
        }
    style:
      left: 48%
      top: 89%
      width: 73%
      transform: translate(-50%, -50%)
      z-index: 4
  - type: custom:button-card
    entity: select.peblar_ev_charger_smart_charging
    name: Default
    icon: mdi:flash
    show_name: true
    show_icon: true
    show_state: false
    tap_action:
      action: call-service
      service: select.select_option
      target:
        entity_id: select.peblar_ev_charger_smart_charging
      data:
        option: default
    hold_action:
      action: none
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - background: rgba(0,0,0,0.28)
        - border-radius: 11px
        - border: |
            [[[
              return entity.state === 'default'
                ? '1px solid rgba(255,193,7,0.65)'
                : '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              return entity.state === 'default'
                ? '0 0 10px rgba(255,193,7,0.25)'
                : 'none';
            ]]]
      icon:
        - width: 25px
        - color: |
            [[[
              return entity.state === 'default'
                ? '#FFC107'
                : '#2196F3';
            ]]]
        - filter: |
            [[[
              return entity.state === 'default'
                ? 'drop-shadow(0 0 5px rgba(255,193,7,0.60))'
                : 'none';
            ]]]
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
    style:
      left: 90%
      top: 10%
      transform: translate(-50%, -50%)
      z-index: 5
  - type: custom:button-card
    entity: select.peblar_ev_charger_smart_charging
    name: Fast solar
    icon: mdi:solar-power
    show_name: true
    show_icon: true
    show_state: false
    tap_action:
      action: call-service
      service: select.select_option
      target:
        entity_id: select.peblar_ev_charger_smart_charging
      data:
        option: fast_solar
    hold_action:
      action: none
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - background: rgba(0,0,0,0.28)
        - border-radius: 11px
        - border: |
            [[[
              return entity.state === 'fast_solar'
                ? '1px solid rgba(255,193,7,0.65)'
                : '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              return entity.state === 'fast_solar'
                ? '0 0 10px rgba(255,193,7,0.25)'
                : 'none';
            ]]]
      icon:
        - width: 25px
        - color: |
            [[[
              return entity.state === 'fast_solar'
                ? '#FFC107'
                : '#2196F3';
            ]]]
        - filter: |
            [[[
              return entity.state === 'fast_solar'
                ? 'drop-shadow(0 0 5px rgba(255,193,7,0.60))'
                : 'none';
            ]]]
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
    style:
      left: 90%
      top: 26%
      transform: translate(-50%, -50%)
      z-index: 5
  - type: custom:button-card
    entity: select.peblar_ev_charger_smart_charging
    name: Smart solar
    icon: mdi:weather-partly-cloudy
    show_name: true
    show_icon: true
    show_state: false
    tap_action:
      action: call-service
      service: select.select_option
      target:
        entity_id: select.peblar_ev_charger_smart_charging
      data:
        option: smart_solar
    hold_action:
      action: none
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - background: rgba(0,0,0,0.28)
        - border-radius: 11px
        - border: |
            [[[
              return entity.state === 'smart_solar'
                ? '1px solid rgba(255,193,7,0.65)'
                : '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              return entity.state === 'smart_solar'
                ? '0 0 10px rgba(255,193,7,0.25)'
                : 'none';
            ]]]
      icon:
        - width: 25px
        - color: |
            [[[
              return entity.state === 'smart_solar'
                ? '#FFC107'
                : '#2196F3';
            ]]]
        - filter: |
            [[[
              return entity.state === 'smart_solar'
                ? 'drop-shadow(0 0 5px rgba(255,193,7,0.60))'
                : 'none';
            ]]]
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
    style:
      left: 90%
      top: 43%
      transform: translate(-50%, -50%)
      z-index: 5
  - type: custom:button-card
    entity: select.peblar_ev_charger_smart_charging
    name: Pure solar
    icon: mdi:solar-power-variant
    show_name: true
    show_icon: true
    show_state: false
    tap_action:
      action: call-service
      service: select.select_option
      target:
        entity_id: select.peblar_ev_charger_smart_charging
      data:
        option: pure_solar
    hold_action:
      action: none
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - background: rgba(0,0,0,0.28)
        - border-radius: 11px
        - border: |
            [[[
              return entity.state === 'pure_solar'
                ? '1px solid rgba(255,193,7,0.65)'
                : '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              return entity.state === 'pure_solar'
                ? '0 0 10px rgba(255,193,7,0.25)'
                : 'none';
            ]]]
      icon:
        - width: 25px
        - color: |
            [[[
              return entity.state === 'pure_solar'
                ? '#FFC107'
                : '#2196F3';
            ]]]
        - filter: |
            [[[
              return entity.state === 'pure_solar'
                ? 'drop-shadow(0 0 5px rgba(255,193,7,0.60))'
                : 'none';
            ]]]
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
    style:
      left: 90%
      top: 59%
      transform: translate(-50%, -50%)
      z-index: 5
  - type: custom:button-card
    entity: switch.peblar_ev_charger_charge
    name: Charge
    icon: mdi:ev-plug-type2
    show_name: true
    show_icon: true
    show_state: false
    triggers_update:
      - sensor.peblar_ev_charger_power
    tap_action:
      action: toggle
    hold_action:
      action: none
    styles:
      card:
        - width: 68px
        - padding: 6px 4px
        - background: rgba(0,0,0,0.28)
        - border-radius: 11px
        - border: |
            [[[
              return entity.state === 'on'
                ? '1px solid rgba(255,193,7,0.65)'
                : '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              return entity.state === 'on'
                ? '0 0 10px rgba(255,193,7,0.25)'
                : 'none';
            ]]]
      icon:
        - width: 25px
        - color: |
            [[[
              return entity.state === 'on'
                ? '#FFC107'
                : '#2196F3';
            ]]]
        - filter: |
            [[[
              return entity.state === 'on'
                ? 'drop-shadow(0 0 5px rgba(255,193,7,0.60))'
                : 'none';
            ]]]
        - animation: |
            [[[
              const power = Number(
                states['sensor.peblar_ev_charger_power']?.state || 0
              );

              if (entity.state === 'on' && power > 100) {
                return 'chargepulse 1.4s ease-in-out infinite';
              }

              return 'none';
            ]]]
      name:
        - color: var(--primary-text-color)
        - font-size: 10px
        - margin-top: 3px
    extra_styles: |
      @keyframes chargepulse {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 4px rgba(255,193,7,0.55));
        }

        50% {
          transform: scale(1.12);
          filter: drop-shadow(0 0 10px rgba(255,193,7,0.95));
        }

        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 4px rgba(255,193,7,0.55));
        }
      }
    style:
      left: 90%
      top: 75%
      transform: translate(-50%, -50%)
      z-index: 5
